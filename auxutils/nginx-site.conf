# nginx server block for the site.
#
# Install as /etc/nginx/conf.d/site.conf on the target server
# (deploy.sh does this automatically). The stock default server block
# in /etc/nginx/nginx.conf must be disabled first (see
# auxutils/disable-default-server.pl) or this block will shadow it
# without taking effect for IP-address requests.
#
# No PHP on this site: .php requests are denied.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/site;
    index index.html;

    access_log /var/log/nginx/site.access.log;
    error_log  /var/log/nginx/site.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # Build/deploy tooling -- never expose it.
    location /auxutils {
        deny all;
    }

    location ~ \.php$ {
	deny all;
    }
}
