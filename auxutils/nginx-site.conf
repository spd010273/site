# nginx server block for the site.
#
# Install as /etc/nginx/conf.d/site.conf on the target server.
# The stock default server block in /etc/nginx/nginx.conf must be
# disabled first (see auxutils/DEPLOY.md) or this block will shadow
# it without taking effect for IP-address requests.
#
# PHP: /var/www/site/*.php are served via php-fpm. The current pages
# contain no PHP code, but the handler is in place so real PHP can be
# added later without config changes.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/site;
    index index.php index.html;

    access_log /var/log/nginx/site.access.log;
    error_log  /var/log/nginx/site.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # Build/deploy tooling -- never expose it.
    location /auxutils {
        deny all;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
